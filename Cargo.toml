[package]
name = "evolution"
version = "0.0.1"
authors = ["Jack"]
edition = "2018"

[features]
ui = ["minifb"]

[lib]
crate-type = ["lib"]
bench = false

[[bin]]
name = "evolution"
test = true
bench = false
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
rand = "0.10.3"
simdeez = "3.0.1"
simdnoise = { path = "../rust-simd-noise" }
variant_count = "1.1.0"
rayon = "1.6.1"
image = "0.24.5"
notify = "5.0.0"
readonly = "0.2.3"
clap = { version = "4.0.32", features = ["derive"] }
minifb = { version = "0.23.0", optional = true }
