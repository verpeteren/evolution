[package]
name = "evolution-fuzz"
version = "0.0.0"
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = "0.10.3"

[dependencies.evolution]
path = ".."

[[bin]]
name = "parse_lisp"
path = "fuzz_targets/parse_lisp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_small"
path = "fuzz_targets/render_small.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
